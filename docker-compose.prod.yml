name: budget-prod

services:
  app:
    build:
      context: .
      args:
        VITE_API_URL: /api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 4100
    ports:
      - "127.0.0.1:8080:4100"
    restart: unless-stopped

  postgres:
    image: postgres:16
    env_file:
      - .env.production
    volumes:
      - budget_prod_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  budget_prod_postgres:
